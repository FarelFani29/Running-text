
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to Computer Science</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 85%;
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 18px;
            color: #ddd;
        }

        .running-text {
            overflow: hidden;
            white-space: nowrap;
            margin-top: 40px;
            padding: 20px 0;
            border-top: 2px solid white;
            border-bottom: 2px solid white;
        }

        .running-text span {
            display: inline-block;
            padding-left: 100%;
            font-size: 40px;
            font-weight: bold;
            animation: bergerak 12s linear infinite;
        }

        @keyframes bergerak {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-100%);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>INTRODUCTION TO COMPUTER SCIENCE</h1>

        <p class="subtitle">
            Tugas Mata Kuliah Introduction to Computer Science
        </p>

        <div class="running-text">
            <span>
                SAYA BANGGA MENJADI MAHASISWA TI
            </span>
        </div>

        <p>Belajar, Berkarya, dan Berinovasi dalam Teknologi.</p>
    </div>

</body>
</html>
