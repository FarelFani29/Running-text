<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saya Bangga Menjadi Mahasiswa TI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #102a43, #176b87);
      font-family: Arial, sans-serif;
      color: white;
    }
    .container {
      width: min(900px, 90%);
      padding: 48px 24px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 20px;
      background: rgba(255,255,255,.10);
      box-shadow: 0 18px 45px rgba(0,0,0,.2);
    }
    h1 { margin: 0 0 18px; font-size: clamp(25px, 5vw, 42px); }
    p { margin: 0 0 28px; color: #d8edf5; font-size: 17px; }
    .marquee {
      overflow: hidden;
      white-space: nowrap;
      padding: 18px 0;
      border-top: 2px solid rgba(255,255,255,.35);
      border-bottom: 2px solid rgba(255,255,255,.35);
    }
    .marquee span {
      display: inline-block;
      padding-left: 100%;
      font-size: clamp(25px, 5vw, 46px);
      font-weight: bold;
      animation: jalan 12s linear infinite;
    }
    @keyframes jalan {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }
    .footer { margin-top: 25px; font-size: 14px; color: #d8edf5; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Running Text</h1>
    <p>Tugas Pemrograman — Teknologi Informasi</p>
    <div class="marquee" aria-label="Saya bangga menjadi mahasiswa TI">
      <span>Saya Bangga Menjadi Mahasiswa TI</span>
    </div>
    <div class="footer">Terus belajar, berkarya, dan berkembang di bidang Teknologi Informasi.</div>
  </main>
</body>
</html>
